[package]
name = "microct-analysis"
version = "0.1.1"
description = "Domain package for micro-CT analysis workflows using jupyter-workbench"
requires-mars = ">=0.14.0"

[dependencies.meridian-dev-workflow]
url = "https://github.com/haowjy/meridian-dev-workflow"

[local-dependencies.meridian-prompter]
url = "https://github.com/haowjy/meridian-prompter"

[settings]
targets = [
    ".claude",
    ".opencode",
    ".codex",
]
models_cache_ttl_hours = 24
